buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+' , changing: true
    }
}

plugins { id 'eclipse'; id 'maven-publish' }
apply plugin: 'net.minecraftforge.gradle'

version = '1.1.1+1.18.2'
group = 'net.vonix'
archivesBaseName = 'settings-browser-forge-1.18.2'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.18.2'
    runs {
        client { workingDirectory project.file('run'); property 'forge.logging.console.level', 'info'; mods { settingsbrowser { source sourceSets.main } } }
        server { workingDirectory project.file('run'); property 'forge.logging.console.level', 'info'; mods { settingsbrowser { source sourceSets.main } } }
    }
}

repositories {
    maven { url = 'https://maven.blamejared.com' }
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.18.2-40.2.0'
    compileOnly fg.deobf('mezz.jei:jei-1.18.2-forge:10.2.1.1011')
}

jar { manifest { attributes('Specification-Title': 'Settings Browser', 'Specification-Vendor': 'Vonix.Network', 'Implementation-Title': project.name, 'Implementation-Version': project.version) } }
